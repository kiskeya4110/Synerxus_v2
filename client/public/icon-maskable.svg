<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Synerxus brand gradients -->
    <linearGradient id="blueGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2A4B7F"/>
      <stop offset="100%" style="stop-color:#1E3A5F"/>
    </linearGradient>
    <linearGradient id="orangeGradMask" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#D35400"/>
      <stop offset="50%" style="stop-color:#E67E22"/>
      <stop offset="100%" style="stop-color:#F39C12"/>
    </linearGradient>
  </defs>

  <!-- Full background for maskable - PWA will crop to circle/rounded shape -->
  <rect width="512" height="512" fill="#FDF8F3"/>

  <!-- Synerxus intertwined ribbon logo - scaled to fit within maskable safe zone (center 80%) -->
  <!-- Safe zone radius = 204px (40% of 512), logo should fit within ~160px radius -->
  <g transform="translate(256, 256) scale(0.48)">
    <!-- Blue ribbon (top loop going left-down) -->
    <path d="M -120 -140
             C -200 -140, -200 60, -120 100
             C -40 140, 40 100, 80 40
             C 120 -20, 160 -80, 120 -140
             C 80 -200, -40 -140, -120 -140"
          fill="none"
          stroke="url(#blueGradMask)"
          stroke-width="48"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- Orange ribbon (bottom loop going right-up) -->
    <path d="M 120 140
             C 200 140, 200 -60, 120 -100
             C 40 -140, -40 -100, -80 -40
             C -120 20, -160 80, -120 140
             C -80 200, 40 140, 120 140"
          fill="none"
          stroke="url(#orangeGradMask)"
          stroke-width="48"
          stroke-linecap="round"
          stroke-linejoin="round"/>
  </g>
</svg>
