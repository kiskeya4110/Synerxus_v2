<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 260" fill="none" role="img" aria-label="The Verifiable newsletter preview">
  <!-- Card background -->
  <rect width="380" height="260" rx="16" fill="#0A1F44"/>

  <!-- Header bar -->
  <rect x="0" y="0" width="380" height="52" rx="16" fill="#061A36"/>
  <rect x="0" y="36" width="380" height="16" fill="#061A36"/>

  <!-- Publication label -->
  <text x="20" y="20" font-family="system-ui, sans-serif" font-size="8" font-weight="700" letter-spacing="2" fill="#D4980C" opacity="0.7">A SYNERXUS PUBLICATION</text>

  <!-- Newsletter title -->
  <text x="20" y="40" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#D4980C">The Verifiable</text>

  <!-- Gold divider -->
  <rect x="20" y="58" width="340" height="1" fill="#D4980C" opacity="0.2"/>

  <!-- Issue label -->
  <rect x="20" y="68" width="60" height="14" rx="7" fill="#D4980C" opacity="0.15"/>
  <text x="50" y="78" font-family="system-ui, sans-serif" font-size="7" font-weight="700" fill="#D4980C" text-anchor="middle">ISSUE 12</text>

  <!-- Article headline -->
  <text x="20" y="101" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="white">From Disclosure to Evidence:</text>
  <text x="20" y="116" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="white">Why the Shift Matters Now</text>

  <!-- Body text lines -->
  <rect x="20" y="126" width="280" height="5" rx="2.5" fill="white" opacity="0.15"/>
  <rect x="20" y="135" width="240" height="5" rx="2.5" fill="white" opacity="0.15"/>
  <rect x="20" y="144" width="260" height="5" rx="2.5" fill="white" opacity="0.15"/>

  <!-- Divider -->
  <rect x="20" y="160" width="340" height="1" fill="white" opacity="0.08"/>

  <!-- Evidence record rows -->
  <!-- Row 1 -->
  <rect x="20" y="170" width="340" height="24" rx="6" fill="white" opacity="0.05"/>
  <rect x="28" y="178" width="6" height="6" rx="1.5" fill="#D4980C" opacity="0.8"/>
  <rect x="42" y="178" width="90" height="6" rx="3" fill="white" opacity="0.3"/>
  <rect x="270" y="176" width="54" height="10" rx="5" fill="#D4980C" opacity="0.2"/>
  <text x="297" y="183" font-family="system-ui, sans-serif" font-size="6" font-weight="700" fill="#D4980C" text-anchor="middle">CONFIRMED</text>

  <!-- Row 2 -->
  <rect x="20" y="198" width="340" height="24" rx="6" fill="white" opacity="0.05"/>
  <rect x="28" y="206" width="6" height="6" rx="1.5" fill="#D4980C" opacity="0.8"/>
  <rect x="42" y="206" width="110" height="6" rx="3" fill="white" opacity="0.3"/>
  <rect x="270" y="204" width="54" height="10" rx="5" fill="white" opacity="0.08"/>
  <text x="297" y="211" font-family="system-ui, sans-serif" font-size="6" font-weight="700" fill="white" opacity="0.4" text-anchor="middle">IN REVIEW</text>

  <!-- Row 3 -->
  <rect x="20" y="226" width="340" height="24" rx="6" fill="white" opacity="0.05"/>
  <rect x="28" y="234" width="6" height="6" rx="1.5" fill="#D4980C" opacity="0.8"/>
  <rect x="42" y="234" width="80" height="6" rx="3" fill="white" opacity="0.3"/>
  <rect x="270" y="232" width="54" height="10" rx="5" fill="#D4980C" opacity="0.2"/>
  <text x="297" y="239" font-family="system-ui, sans-serif" font-size="6" font-weight="700" fill="#D4980C" text-anchor="middle">CONFIRMED</text>
</svg>
