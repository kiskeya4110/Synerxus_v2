<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- White background -->
  <rect width="512" height="512" fill="white"/>

  <!--
    Synerxus infinity / Möbius-strip mark.
    Layer order (back → front):
      1. Full figure-8 outline in steel-blue
      2. Orange diagonal ribbon (lower-left → upper-right)
      3. Re-draw the arcs that sit "above" the orange ribbon
  -->

  <!-- 1. Full figure-8 stroke — steel blue -->
  <path
    d="M256,256
       C256,186 194,114 144,114
       C94,114  62,178  62,256
       C62,334  94,398  144,398
       C194,398 256,326 256,256
       C256,186 318,114 368,114
       C418,114 450,178 450,256
       C450,334 418,398 368,398
       C318,398 256,326 256,256 Z"
    fill="none"
    stroke="#5B7080"
    stroke-width="64"
    stroke-linejoin="round"
  />

  <!-- 2. Orange diagonal ribbon — bottom-left to top-right -->
  <line
    x1="82" y1="408"
    x2="430" y2="104"
    stroke="#D4730A"
    stroke-width="64"
    stroke-linecap="round"
  />

  <!-- 3a. Upper-left arc of figure-8 redrawn above orange -->
  <path
    d="M256,256
       C256,186 194,114 144,114
       C94,114  62,178  62,256"
    fill="none"
    stroke="#5B7080"
    stroke-width="64"
    stroke-linecap="round"
  />

  <!-- 3b. Lower-right arc of figure-8 redrawn above orange -->
  <path
    d="M256,256
       C256,326 318,398 368,398
       C418,398 450,334 450,256"
    fill="none"
    stroke="#5B7080"
    stroke-width="64"
    stroke-linecap="round"
  />
</svg>
