<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="infinityGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b45309;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="100" height="100" fill="#ffffff"/>
  
  <!-- Infinity loop symbol -->
  <g transform="translate(50, 50)">
    <!-- Left loop -->
    <path d="M -25 0 Q -35 -15 -35 0 Q -35 15 -25 0" fill="none" stroke="url(#infinityGrad)" stroke-width="5" stroke-linecap="round"/>
    <!-- Right loop -->
    <path d="M 25 0 Q 35 -15 35 0 Q 35 15 25 0" fill="none" stroke="url(#infinityGrad)" stroke-width="5" stroke-linecap="round"/>
    <!-- Center connection -->
    <path d="M -25 0 L 25 0" stroke="url(#infinityGrad)" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>