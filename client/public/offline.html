<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A1F44" />
    <title>Synerxus Offline</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 420px);
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        background: #ffffff;
        padding: 28px;
        box-shadow: 0 18px 45px rgb(15 23 42 / 0.08);
      }

      h1 {
        margin: 0 0 10px;
        color: #0a1f44;
        font-size: 24px;
        line-height: 1.15;
      }

      p {
        margin: 0;
        color: #475569;
        font-size: 15px;
        line-height: 1.6;
      }

      button {
        margin-top: 22px;
        width: 100%;
        min-height: 44px;
        border: 0;
        border-radius: 10px;
        background: #0a1f44;
        color: #ffffff;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>
        Synerxus could not reach the network. Previously loaded pages may still
        be available, and saved offline activity will sync when your connection returns.
      </p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
