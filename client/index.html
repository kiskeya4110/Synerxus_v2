    <!-- FAQ Schema for rich results -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Does Synerxus replace our existing volunteer tracking platform?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Synerxus is an independent verification layer that sits between your activity tracker and your ESG aggregator. It adds partner-confirmed outputs and a tamper-evident audit trail on top of what you already have."
          }
        },
        {
          "@type": "Question",
          "name": "Is Synerxus compliant with CSRD and ESRS S3/S4?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Synerxus is designed to produce evidence that supports CSRD disclosure obligations under ESRS S3 and S4. Every verified outcome is tagged to the relevant ESRS standard and UN SDG, creating a traceable chain of evidence for third-party assurance."
          }
        },
        {
          "@type": "Question",
          "name": "How does partner confirmation work?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "After a volunteer logs an activity, the assigned authorized partner receives an in-app or SMS confirmation request. They confirm the output through a lightweight verification workflow, and the result is recorded in a tamper-evident, system-retained evidence record."
          }
        },
        {
          "@type": "Question",
          "name": "How long does verification typically take?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The average verification turnaround is 16 hours, with a target SLA of 72 hours. NGOs are notified instantly and can verify from any mobile device without creating an account."
          }
        },
        {
          "@type": "Question",
          "name": "What is WEF SCM?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "WEF SCM stands for the World Economic Forum Stakeholder Capitalism Metrics — a universal set of sustainability indicators designed to harmonise GRI, SASB, TCFD, and ESRS into a single standard. Synerxus uses WEF SCM as its primary framework so evidence collected once satisfies multiple reporting requirements simultaneously."
          }
        },
        {
          "@type": "Question",
          "name": "What is CSRD?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "CSRD stands for the Corporate Sustainability Reporting Directive — an EU regulation requiring large companies to publish detailed, audited sustainability reports against ESRS standards. Synerxus produces partner-confirmed, audit-ready evidence that supports CSRD / ESRS reporting preparation. CSRD compliance is determined by independent assurance providers, not by Synerxus."
          }
        },
        {
          "@type": "Question",
          "name": "What is ISAE 3000?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "ISAE 3000 is the International Standard on Assurance Engagements 3000 — the global auditing standard used when providing assurance over ESG reports. Synerxus structures every verified outcome to meet ISAE 3000 evidence requirements, reducing auditor evidence-gathering effort by 60–70%. Formal assurance still requires an independent auditor."
          }
        },
        {
          "@type": "Question",
          "name": "What are the UN SDGs?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The UN SDGs — Sustainable Development Goals — are 17 global goals adopted by the United Nations in 2015, covering areas from No Poverty and Quality Education to Climate Action. Every outcome logged on Synerxus is automatically mapped to one or more SDGs."
          }
        }
      ]
    }
    </script>
