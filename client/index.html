    <!-- FAQ Schema for rich results -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Does Synerxus replace our existing volunteer tracking platform?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Synerxus is an evidence support layer that sits between your activity tracker and your ESG aggregator. It adds partner-confirmed evidence packets, source artifact references, confidence tiers, and exception tracking on top of what you already have."
          }
        },
        {
          "@type": "Question",
          "name": "Is Synerxus compliant with CSRD and ESRS S3/S4?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Synerxus structures claim-level evidence that can support CSRD and ESRS reporting preparation. Framework mapping does not determine compliance or replace independent assurance."
          }
        },
        {
          "@type": "Question",
          "name": "How does partner confirmation work?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "After a volunteer logs an activity, the assigned authorized partner receives an in-app or SMS confirmation request. They confirm the submitted activity record through a lightweight workflow, and the response is retained as part of the evidence packet."
          }
        },
        {
          "@type": "Question",
          "name": "How long does verification typically take?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Confirmation timing depends on the pilot workflow, partner availability, and evidence requirements. The target for simple partner confirmations is under 48 hours."
          }
        },
        {
          "@type": "Question",
          "name": "What is WEF SCM?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "WEF SCM stands for the World Economic Forum Stakeholder Capitalism Metrics — a universal set of sustainability indicators designed to harmonise GRI, SASB, TCFD, and ESRS into a single standard. Synerxus can map evidence records to selected frameworks where appropriate, but framework mapping does not mean one record satisfies every reporting requirement."
          }
        },
        {
          "@type": "Question",
          "name": "What is CSRD?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "CSRD stands for the Corporate Sustainability Reporting Directive — an EU regulation requiring large companies to publish detailed, audited sustainability reports against ESRS standards. Synerxus produces partner-confirmed evidence packets that support CSRD / ESRS reporting preparation. CSRD compliance is determined by the reporting entity and its advisors or assurance providers, not by Synerxus."
          }
        },
        {
          "@type": "Question",
          "name": "What is ISAE 3000?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "ISAE 3000 is the International Standard on Assurance Engagements 3000 — the global auditing standard used when providing assurance over ESG reports. Synerxus can organize evidence records for assurance preparation, but ISAE 3000 scope and sufficiency are determined by the assurance practitioner. Formal assurance still requires an independent auditor."
          }
        },
        {
          "@type": "Question",
          "name": "What are the UN SDGs?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The UN SDGs — Sustainable Development Goals — are 17 global goals adopted by the United Nations in 2015, covering areas from No Poverty and Quality Education to Climate Action. Synerxus can map relevant claim and activity records to SDGs where the mapping is supported and clearly labeled."
          }
        }
      ]
    }
    </script>
