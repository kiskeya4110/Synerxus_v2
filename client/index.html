          "@type": "Question",

            "@type": "Answer",
            "text": "Synerxus is designed to produce evidence that supports CSRD disclosure obligations under ESRS S3 and S4. Every verified outcome is tagged to the relevant ESRS standard and UN SDG, creating a traceable chain of evidence for third-party assurance."

        },
        {
          "@type": "Question",
          "name": "How does NGO verification work?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "After a volunteer logs an activity, the assigned NGO partner receives an instant SMS or in-app verification request. They confirm the outcome with a single tap in under 15 seconds. The result is sealed into a tamper-proof evidence record."
          }
        },
        {
          "@type": "Question",
          "name": "How long does verification typically take?",
          "acceptedAnswer": {
            "@type": "Answer",

          }
        }
