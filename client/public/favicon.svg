<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="infinityGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background with padding -->
  <rect width="100" height="100" fill="#1a1a2e"/>

  <!-- Infinity loop symbol with padding - scaled down to 70% to prevent cropping -->
  <g transform="translate(50, 50) scale(0.7)">
    <!-- Left loop -->
    <path d="M -25 0 Q -35 -15 -35 0 Q -35 15 -25 0" fill="none" stroke="url(#infinityGrad)" stroke-width="6" stroke-linecap="round"/>
    <!-- Right loop -->
    <path d="M 25 0 Q 35 -15 35 0 Q 35 15 25 0" fill="none" stroke="url(#infinityGrad)" stroke-width="6" stroke-linecap="round"/>
    <!-- Center connection -->
    <path d="M -25 0 L 25 0" stroke="url(#infinityGrad)" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>